name: Build Native Codec Libraries (LAME)

on:
  workflow_dispatch:
    inputs:
      lame_version:
        description: 'LAME version to build (download from SourceForge)'
        required: false
        default: '3.100'

# Builds libmp3lame.so for Android ABIs with the NDK and uploads the results
# as an artifact. The maintainer downloads the artifact and checks the .so
# files into android/app/src/main/jniLibs so the main app build never needs
# to compile third-party code (fixture-style bundled library).
jobs:
  build-lame-android:
    name: Build libmp3lame.so (Android NDK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK (NDK provisioning)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;25.2.9519653" || true
          echo "NDK_VERSION=25.2.9519653" >> $GITHUB_ENV

      - name: Download LAME source
        run: |
          mkdir -p build-src
          curl -fL "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz" -o build-src/lame.tar.gz
          tar -xzf build-src/lame.tar.gz -C build-src
          ls build-src

      - name: Build for arm64-v8a & armeabi-v7a
        shell: bash
        run: |
          set -e
          NDK="$ANDROID_HOME/ndk/25.2.9519653"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          API=24
          SRC="$GITHUB_WORKSPACE/build-src/lame-3.100"
          export PATH="$TOOLCHAIN/bin:$PATH"

          build_abi() {
            local TARGET="$1"; local OUT="$2"
            # NDK wrapper names vary (with/without API level suffix); find one.
            local WRAPPER
            WRAPPER=$(ls "$TOOLCHAIN/bin/${TARGET}"*-clang 2>/dev/null | head -1)
            if [ -z "$WRAPPER" ]; then
              echo "No clang wrapper for $TARGET"; ls "$TOOLCHAIN/bin" | grep clang | head -20
              exit 1
            fi
            echo "Using wrapper: $WRAPPER"
            export AR="$TOOLCHAIN/bin/llvm-ar"
            export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
            export LD="$TOOLCHAIN/bin/ld.lld"
            export STRIP="$TOOLCHAIN/bin/llvm-strip"
            export NM="$TOOLCHAIN/bin/llvm-nm"
            export OBJDUMP="$TOOLCHAIN/bin/llvm-objdump"
            export CC="$WRAPPER"
            export CXX="${WRAPPER/clang/clang++}"
            export CFLAGS="-O3"

            # Diagnostic: verify the toolchain can link before running configure.
            echo 'int main(void){return 0;}' > /tmp/linktest.c
            if ! "$CC" -o /tmp/linktest /tmp/linktest.c 2>/tmp/linktest.err; then
              echo "=== LINK TEST FAILED for $TARGET ==="
              cat /tmp/linktest.err
              exit 1
            fi
            echo "link test OK: $TARGET"

            (
              cd "$SRC"
              make clean >/dev/null 2>&1 || true
              ./configure \
                --host="$TARGET" \
                --build=x86_64-pc-linux-gnu \
                --enable-shared --disable-frontend --disable-static \
                --prefix="$GITHUB_WORKSPACE/dist/$OUT" || { echo "CONFIGURE FAILED for $TARGET"; exit 1; }
              make -j4 || { echo "MAKE FAILED for $TARGET"; exit 1; }
              make install
            )
          }

          mkdir -p dist
          build_abi aarch64-linux-android arm64-v8a
          build_abi armv7a-linux-androideabi armeabi-v7a

          echo "=== artifacts ==="
          find dist -name "*.so*" -exec ls -la {} \;

      - name: Upload LAME .so artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libmp3lame-android
          path: dist/*/lib/*.so*
          if-no-files-found: error