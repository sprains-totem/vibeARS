name: vibeARS Build & Release CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release Version Tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write
  packages: write

jobs:
  # ==========================================
  # 1. Build Android APK
  # ==========================================
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Initialize Platform Skeletons & Dependencies
        run: |
          flutter create --project-name vibears --platforms=android,ios --org com.vibears --no-overwrite .
          flutter pub get

      - name: Restore Android Signing Keystore (from Secrets)
        shell: bash
        run: |
          printf '%s' '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 -d > android/app/vibears-release.keystore
          ls -la android/app/vibears-release.keystore

      - name: Build Android Release APK
        run: flutter build apk --release
        env:
          # Path is relative to the android/app module directory.
          ANDROID_KEYSTORE_FILE: vibears-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/vibeARS-Android-release.apk

      - name: Build Android Debug APK (Full Logging Diagnostics Build)
        # arm64-only: debug APKs are much larger than release (JIT kernel +
        # unstripped .so); limiting to the arm64 ABI used by virtually all
        # modern devices keeps the diagnostics build manageable.
        run: flutter build apk --debug --target-platform android-arm64

      - name: Copy & Rename Debug APK
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk output/vibeARS-Android-debug-arm64.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibeARS-Android-APK
          path: |
            output/vibeARS-Android-release.apk
            output/vibeARS-Android-debug-arm64.apk
          if-no-files-found: error

  # ==========================================
  # 2. Build iOS IPA (Unsigned / Ad-Hoc)
  # ==========================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Initialize Platform Skeletons & Dependencies
        run: |
          flutter create --project-name vibears --platforms=android,ios --org com.vibears --no-overwrite .
          flutter pub get

      - name: Build iOS Application (No Code Sign)
        run: |
          flutter build ios --config-only --no-codesign
          cd ios
          pod install
          xcodebuild build -workspace Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath ../build/ios
          cd ..

      - name: Package IPA Archive
        run: |
          mkdir -p output/Payload
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          echo "Found app at $APP_PATH"
          cp -r "$APP_PATH" output/Payload/
          cd output
          zip -r vibeARS-iOS-unsigned.ipa Payload
          cd ..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibeARS-iOS-IPA
          path: output/vibeARS-iOS-unsigned.ipa
          if-no-files-found: error

  # ==========================================
  # 3. Create GitHub Release & Attach Binaries
  # ==========================================
  release:
    name: Publish GitHub Release
    needs: [build-android, build-ios]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: vibeARS-Android-APK
          path: release-assets

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: vibeARS-iOS-IPA
          path: release-assets

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v1.0.0-build-$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "vibeARS Release ${{ steps.vars.outputs.TAG_NAME }}"
          body: |
            ## vibeARS 生产就绪版本发布 (${{ steps.vars.outputs.TAG_NAME }})

            ### 🚀 本次构建产物：
            - **Android 客户端（正式版）**: `vibeARS-Android-release.apk` (支持 Android 7.0 - Android 14，可覆盖安装)
            - **Android 客户端（调试版·全量日志）**: `vibeARS-Android-debug-arm64.apk` (独立 applicationId `com.vibears.app.debug`，可与正式版共存安装，用于蓝牙/录音问题排查；仅 arm64 架构)
            - **iOS 客户端**: `vibeARS-iOS-unsigned.ipa` (支持 iOS 14.0+)

            ### 🎙️ 核心功能特性：
            - **不间断后台录音**：Android Foreground Service (Mic) + WakeLock 保活；iOS Background Audio Mode。
            - **上游麦克风硬件探测与自由切换**：支持探测内置麦克风、蓝牙耳机 (SCO/A2DP)、USB声卡、有线耳机，展示采样率、声道数、拾音模式，并支持为每个设备选择输出格式（采样率/声道）。
            - **无限循环录制**：对标行车记录仪/监控摄像头，设置存储配额后自动覆盖最旧未锁定片段，关键片段可锁定保护。
            - **实时流式传输 (Live Streaming)**：WebSocket 二进制帧上行，支持原始 PCM 或 AAC/ADTS 压缩编码，含心跳测延迟与断线重连。
            - **5分钟无缝分段切片与上传**：基于样本计数的无缝滚转（零丢帧、零爆音），自动同步上传至 **WebDAV** 与 **S3 兼容存储**。
            - **本地多格式录制**：原生支持 WAV (PCM) 与 AAC/M4A 录制，码率设置真实生效。
          files: |
            release-assets/vibeARS-Android-release.apk
            release-assets/vibeARS-Android-debug-arm64.apk
            release-assets/vibeARS-iOS-unsigned.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
