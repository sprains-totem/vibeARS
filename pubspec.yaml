name: vibears
description: "vibeARS - High-Performance Uninterrupted Audio Recording, Streaming & Multi-Storage Slicing Engine"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & UI Utilities
  provider: ^6.1.2
  intl: ^0.18.1
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  
  # File System & Paths
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Audio Playback & Waveform
  audioplayers: ^6.0.0
  
  # Networking, Streaming & Remote Storage
  web_socket_channel: ^2.4.5
  http: ^1.2.1
  crypto: ^3.0.3
  xml: ^6.5.0
  
  # Background & Notification
  flutter_local_notifications: ^17.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
